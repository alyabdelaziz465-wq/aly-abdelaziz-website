<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>Aly Abdelaziz | HR • Career Development • Leadership • AI & Future of Work</title>

<meta name="description" content="Aly Abdelaziz — HR professional, trainer and consultant focused on Human Resources, career development, leadership, performance, AI and the future of work.">

<meta name="robots" content="index, follow">

<link rel="canonical" href="https://www.alyabdelaziz.com/">

<style>
:root{
  --navy:#08243d;
  --navy2:#0d3858;
  --sky:#35bfe8;
  --sky2:#9be9ff;
  --gold:#d8aa45;
  --gold2:#ffe08a;
  --ink:#10283d;
  --muted:#5c7183;
  --paper:#f5fafc;
  --white:#fff;
  --line:#dbeaf1;
  --shadow:0 18px 50px rgba(8,36,61,.11);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
  scroll-padding-top:85px;
}

body{
  margin:0;
  font-family:Inter,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.7;
  overflow-x:hidden;
}

body[dir="rtl"]{
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

img{
  max-width:100%;
  display:block;
}

button{
  font:inherit;
}

/* =========================
   HEADER
========================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,36,61,.97);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(155,233,255,.18);
  color:#fff;
}

.header-inner{
  max-width:1400px;
  min-height:76px;
  margin:auto;
  padding:10px clamp(14px,4vw,54px);
  display:flex;
  align-items:center;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family:Georgia,serif;
  font-weight:800;
  font-size:32px;
  color:var(--gold2);
  letter-spacing:-2px;
  white-space:nowrap;
}

.menu-button,
.language-button{
  border:1px solid rgba(155,233,255,.42);
  background:rgba(13,56,88,.55);
  color:#fff;
  border-radius:15px;
  min-height:45px;
  padding:0 15px;
  cursor:pointer;
  font-weight:800;
  transition:.2s ease;
}

.menu-button:hover,
.language-button:hover{
  border-color:var(--sky2);
  background:rgba(53,191,232,.12);
}

.menu-button{
  margin-left:auto;
}

.menu-icon{
  font-size:19px;
  margin-right:6px;
}

/* =========================
   DROPDOWN MENU
========================= */

.nav-panel{
  position:fixed;
  top:76px;
  left:50%;
  width:min(620px,calc(100% - 28px));
  max-height:calc(100vh - 92px);
  overflow:auto;
  transform:translate(-50%,-15px);
  background:rgba(8,43,69,.99);
  border:1px solid rgba(155,233,255,.25);
  border-top:0;
  border-radius:0 0 24px 24px;
  padding:10px;
  box-shadow:0 25px 70px rgba(0,0,0,.30);
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:.22s ease;
}

.nav-panel.open{
  transform:translate(-50%,0);
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.nav-panel a{
  display:block;
  padding:11px 14px;
  border-radius:11px;
  color:#eefaff;
  font-size:14px;
}

.nav-panel a:hover{
  background:rgba(53,191,232,.14);
  color:var(--gold2);
}

.nav-divider{
  height:1px;
  background:rgba(255,255,255,.10);
  margin:8px 10px;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 18%,rgba(53,191,232,.24),transparent 29%),
    radial-gradient(circle at 15% 85%,rgba(216,170,69,.13),transparent 25%),
    linear-gradient(135deg,#06172c,#0b2b4c 58%,#0b3b5a);
  color:#fff;
  padding:78px clamp(20px,6vw,90px) 82px;
}

.hero-inner{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:55px;
  align-items:center;
}

.hero-copy{
  max-width:760px;
}

.eyebrow{
  margin:0 0 14px;
  color:var(--gold2);
  font-size:12px;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
}

.hero h1{
  font-size:clamp(60px,8vw,108px);
  line-height:.88;
  margin:0;
  letter-spacing:-5px;
}

.hero h1 span{
  color:var(--sky2);
}

.gold-line{
  width:120px;
  height:4px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
  margin:28px 0;
}

.hero h2{
  font-size:clamp(18px,2.3vw,29px);
  line-height:1.4;
  margin:0 0 20px;
}

.tagline{
  font-size:clamp(24px,3vw,38px);
  line-height:1.28;
  margin:0 0 20px;
}

.hero-text{
  font-size:17px;
  color:#cbe0ec;
  max-width:720px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  margin-top:27px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:11px 20px;
  border-radius:13px;
  font-weight:800;
  transition:.2s ease;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.primary{
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  color:#12243a;
}

.btn.ghost{
  border:1px solid rgba(155,233,255,.5);
  color:#fff;
  background:rgba(255,255,255,.04);
}

.socials{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  margin-top:19px;
  color:#c4efff;
  font-weight:800;
  font-size:14px;
}

.socials a:hover{
  color:var(--gold2);
}

/* =========================
   PORTRAIT
========================= */

.hero-visual{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:520px;
}

.orb{
  position:absolute;
  width:470px;
  height:470px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(53,191,232,.22),
    transparent 68%
  );
  filter:blur(3px);
}

.portrait-wrap{
  position:relative;
  width:min(455px,94%);
  aspect-ratio:4/5;
  border-radius:32px;
  overflow:hidden;
  border:1px solid rgba(155,233,255,.5);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
  background:#0b213a;
}

.portrait-wrap:before{
  content:"";
  position:absolute;
  inset:12px;
  border:1px solid rgba(255,224,138,.45);
  border-radius:24px;
  z-index:2;
  pointer-events:none;
}

.portrait{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:69% center;
  transform:scale(1.08);
}

/* =========================
   VALUES
========================= */

.values{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border-bottom:1px solid var(--line);
}

.values article{
  padding:28px 25px;
  border-inline-end:1px solid var(--line);
}

.values article:last-child{
  border:0;
}

.values span,
.num{
  color:var(--gold);
  font-weight:900;
  letter-spacing:1px;
}

.values h3{
  margin:6px 0;
  font-size:18px;
}

.values p{
  margin:0;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   SECTIONS
========================= */

.section{
  padding:86px clamp(20px,6vw,90px);
  max-width:1400px;
  margin:auto;
}

.section-inner{
  max-width:1400px;
  margin:auto;
}

.dark-section{
  max-width:none;
  background:linear-gradient(135deg,#081d36,#0d3b5a);
  color:#fff;
}

.section-head{
  max-width:930px;
  margin-bottom:36px;
}

.section h2{
  font-size:clamp(33px,4.5vw,57px);
  line-height:1.08;
  margin:0;
  letter-spacing:-1.7px;
}

.lead{
  font-size:21px;
  color:#334b61;
}

/* =========================
   ABOUT
========================= */

.about-grid{
  display:grid;
  grid-template-columns:1.25fr .75fr;
  gap:45px;
}

.about-grid p{
  font-size:17px;
}

.quote-card{
  background:linear-gradient(135deg,#e9f8ff,#fff);
  border:1px solid #cdebf8;
  border-radius:24px;
  padding:36px;
  box-shadow:var(--shadow);
}

.quote-mark{
  font:70px Georgia,serif;
  color:var(--sky);
  line-height:.6;
}

.quote-card p{
  font-size:24px!important;
  line-height:1.35;
  color:#16324c;
}

.quote-card small{
  font-weight:800;
  color:#597086;
}

/* =========================
   HR EXPERTISE
========================= */

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:17px;
}

.card{
  padding:25px;
  border-radius:21px;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(155,233,255,.18);
  position:relative;
  overflow:hidden;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:rgba(155,233,255,.5);
}

.card h3{
  font-size:20px;
  line-height:1.25;
  margin:9px 0;
}

.card p{
  color:#c7dce8;
  font-size:14px;
}

/* =========================
   PERFORMANCE
========================= */

.service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.service{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:22px;
  box-shadow:0 10px 30px rgba(8,36,61,.06);
}
