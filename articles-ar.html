<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المقالات والرؤى | علي عبد العزيز</title><meta name="description" content="مقالات مهنية متعمقة في الموارد البشرية والتطوير المهني والأداء والذكاء الاصطناعي ومستقبل العمل."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="wrap head"><a class="brand" href="index-ar.html"><span>AA</span><small>علي عبد العزيز</small></a><nav class="nav"><a href="index-ar.html#hr">منظومة الموارد البشرية</a><a href="index-ar.html#people">الأفراد والأداء</a><a href="index-ar.html#career">التطوير المهني</a><a href="index-ar.html#ai">الذكاء الاصطناعي والعمل</a><a href="articles-ar.html">المقالات</a><a href="index-ar.html#contact">تواصل</a></nav><div class="head-actions"><button class="menu" id="menuBtn">☰ القائمة</button><a class="lang" href="articles.html">English</a></div></div><nav class="mobile" id="mobileNav"><a href="index-ar.html#hr">منظومة الموارد البشرية</a><a href="index-ar.html#people">الأفراد والأداء</a><a href="index-ar.html#career">التطوير المهني</a><a href="index-ar.html#ai">الذكاء الاصطناعي والعمل</a><a href="articles-ar.html">المقالات</a><a href="index-ar.html#contact">تواصل</a></nav></header><main id="content"></main><script src="articles-data.js"></script><script>
const isAR=document.documentElement.lang==='ar';
const data=window.ARTICLE_LIBRARY[isAR?'ar':'en'];
const qs=new URLSearchParams(location.search); const id=qs.get('id');
const coverLabels={
 'cover-diagnosis':['DIAGNOSE','01'], 'cover-hiring':['EVIDENCE','02'], 'cover-performance':['PERFORMANCE','03'], 'cover-career':['CAREER','04'], 'cover-ai':['AI + HUMAN','05'], 'cover-skills':['SKILLS','06']
};
function coverSvg(f){const svgs={A:`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650'><rect width='1200' height='650' fill='%2308243d'/><circle cx='980' cy='130' r='230' fill='%2335bfe8' opacity='.18'/><path d='M80 520h1040' stroke='%23d8aa45' stroke-width='5'/><text x='80' y='180' fill='white' font-family='Arial' font-size='54' font-weight='700'>HR DIAGNOSIS</text><text x='80' y='250' fill='%239be9ff' font-family='Arial' font-size='28'>From symptoms to root causes</text></svg>`,B:`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650'><rect width='1200' height='650' fill='%230d3858'/><rect x='80' y='90' width='1040' height='470' rx='30' fill='%2308243d'/><text x='130' y='210' fill='white' font-family='Arial' font-size='50' font-weight='700'>EVIDENCE-BASED</text><text x='130' y='275' fill='%2335bfe8' font-family='Arial' font-size='34'>TALENT ACQUISITION</text><circle cx='940' cy='380' r='110' fill='%23d8aa45' opacity='.65'/></svg>`,C:`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650'><rect width='1200' height='650' fill='%23123f60'/><path d='M100 500L320 390 520 430 760 230 1080 150' fill='none' stroke='%2335bfe8' stroke-width='12'/><text x='90' y='150' fill='white' font-family='Arial' font-size='48' font-weight='700'>PERFORMANCE</text><text x='90' y='205' fill='%23ffe08a' font-family='Arial' font-size='28'>Diagnose before you intervene</text></svg>`,D:`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650'><rect width='1200' height='650' fill='%2308243d'/><path d='M120 510C300 430 370 300 540 330S800 460 1060 140' fill='none' stroke='%23d8aa45' stroke-width='9'/><circle cx='1060' cy='140' r='28' fill='%2335bfe8'/><text x='90' y='160' fill='white' font-family='Arial' font-size='48' font-weight='700'>CAREER SHIFT</text><text x='90' y='215' fill='%239be9ff' font-family='Arial' font-size='28'>Transferable skills. Deliberate moves.</text></svg>`,E:`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650'><rect width='1200' height='650' fill='%230d3858'/><g stroke='%2335bfe8' stroke-width='4' opacity='.7'><path d='M250 150h700v350H250z'/><path d='M250 325h700M600 150v350'/></g><text x='110' y='120' fill='white' font-family='Arial' font-size='45' font-weight='700'>AI ACROSS HR</text><text x='110' y='585' fill='%23ffe08a' font-family='Arial' font-size='27'>Automate where possible. Keep judgment human.</text></svg>`,F:`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 650'><rect width='1200' height='650' fill='%23123f60'/><rect x='100' y='110' width='1000' height='430' rx='28' fill='%2308243d'/><path d='M180 450l180-170 170 110 190-210 200 100' fill='none' stroke='%23d8aa45' stroke-width='10'/><text x='120' y='185' fill='white' font-family='Arial' font-size='47' font-weight='700'>FROM JOBS TO SKILLS</text></svg>`};return svgs[f]||svgs.A}function cover(cls){const map={'cover-diagnosis':'A','cover-hiring':'B','cover-performance':'C','cover-career':'D','cover-ai':'E','cover-skills':'F'};const f=map[cls]||'A';return `<div class="article-cover ${cls}"><img src="data:image/svg+xml;charset=UTF-8,${encodeURIComponent(coverSvg(f))}" alt="" loading="lazy"></div>`}
function card(a){return `<article class="article-card">${cover(a.cover)}<div class="article-body"><div class="article-meta">${a.category} · ${a.read}</div><h3>${a.title}</h3><p>${a.excerpt}</p><a class="article-read" href="${isAR?'articles-ar.html':'articles.html'}?id=${encodeURIComponent(a.id)}">${isAR?'اقرأ المقال ←':'Read article →'}</a></div></article>`}
function render(){const root=document.getElementById('content'); if(id){const a=data.find(x=>x.id===id); if(!a){location.href=isAR?'articles-ar.html':'articles.html';return;} root.innerHTML=`<section class="section"><div class="wrap article-page"><a class="back-link" href="${isAR?'articles-ar.html':'articles.html'}">${isAR?'← العودة إلى المقالات':'← Back to all articles'}</a>${cover(a.cover)}<div class="article-kicker">${a.category} · ${a.read}</div><h1>${a.title}</h1><p class="article-intro">${a.excerpt}</p><div class="article-content">${a.content}</div><div class="library-note">${isAR?'هذا المقال جزء من مكتبة معرفية تتوسع باستمرار. يمكن إضافة مقالات جديدة إلى ملف مكتبة المقالات ثم نشرها على الصفحة نفسها.':'This article is part of a growing knowledge library. New articles can be added to the article library file and published through this same page.'}</div></div></section>`;} else {root.innerHTML=`<section class="articles-hero"><div class="wrap"><div class="label">${isAR?'المقالات والرؤى':'INSIGHTS & ARTICLES'}</div><h1>${isAR?'معرفة مهنية تتحول إلى قرار وتنفيذ.':'Professional knowledge turned into decisions and action.'}</h1><p>${isAR?'مقالات تفصيلية في الموارد البشرية والتطوير المهني والاستقطاب والأداء والذكاء الاصطناعي ومستقبل العمل، مع التركيز على التشخيص وآليات التنفيذ وعلاج المشكلات.':'In-depth articles on HR, career development, talent acquisition, performance, AI and the future of work — with a strong focus on diagnosis, implementation and problem solving.'}</p></div></section><section class="section"><div class="wrap"><div class="library-note">${isAR?'هذه الصفحة هي مكتبة المقالات. كل مقال له صفحة قراءة مستقلة وصورة تعريفية، ويمكن توسيع المكتبة بإضافة مقالات جديدة إلى ملف articles-data.js.':'This is the article library. Every article has its own reading view and distinctive cover. The library can be expanded by adding new articles to articles-data.js.'}</div><div class="article-library-grid">${data.map(card).join('')}</div></div></section>`;}}
render();
const mb=document.getElementById('menuBtn'),mn=document.getElementById('mobileNav');if(mb&&mn)mb.onclick=()=>mn.classList.toggle('open');
</script></body></html>
