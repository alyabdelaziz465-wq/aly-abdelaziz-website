<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المقالات والرؤى | علي عبد العزيز</title><meta name="description" content="مقالات مهنية متعمقة في الموارد البشرية والتطوير المهني والأداء والذكاء الاصطناعي ومستقبل العمل."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="wrap head"><a class="brand" href="index-ar.html"><span>AA</span><small>علي عبد العزيز</small></a><nav class="nav"><a href="index-ar.html#hr">منظومة الموارد البشرية</a><a href="index-ar.html#people">الأفراد والأداء</a><a href="index-ar.html#career">التطوير المهني</a><a href="index-ar.html#ai">الذكاء الاصطناعي والعمل</a><a href="articles-ar.html">المقالات</a><a href="index-ar.html#contact">تواصل</a></nav><div class="head-actions"><button class="menu" id="menuBtn">☰ القائمة</button><a class="lang" href="articles.html">English</a></div></div><nav class="mobile" id="mobileNav"><a href="index-ar.html#hr">منظومة الموارد البشرية</a><a href="index-ar.html#people">الأفراد والأداء</a><a href="index-ar.html#career">التطوير المهني</a><a href="index-ar.html#ai">الذكاء الاصطناعي والعمل</a><a href="articles-ar.html">المقالات</a><a href="index-ar.html#contact">تواصل</a></nav></header><main id="content"></main><script src="articles-data.js"></script><script>
const isAR=true;
const data=window.ARTICLE_LIBRARY[isAR?'ar':'en'];
const qs=new URLSearchParams(location.search); const id=qs.get('id');
const coverMap={'cover-diagnosis':'cover-diagnosis.svg','cover-hiring':'cover-hiring.svg','cover-performance':'cover-performance.svg','cover-career':'cover-career.svg','cover-ai':'cover-ai.svg','cover-skills':'cover-skills.svg'};
const labels=isAR?{'cover-diagnosis':['التشخيص','٠١'],'cover-hiring':['الاستقطاب','٠٢'],'cover-performance':['التوظيف القائم على الأدلة','٠٣'],'cover-career':['التطوير المهني','٠٤'],'cover-ai':['الذكاء الاصطناعي والإنسان','٠٥'],'cover-skills':['المهارات ومستقبل العمل','٠٦']}:{'cover-diagnosis':['DIAGNOSIS','01'],'cover-hiring':['EVIDENCE-BASED HIRING','02'],'cover-performance':['PERFORMANCE','03'],'cover-career':['CAREER SHIFT','04'],'cover-ai':['AI + HUMAN','05'],'cover-skills':['SKILLS','06']};
function cover(a,hero=false){const src=coverMap[a.cover]||'cover-diagnosis.svg'; const alt=isAR?('صورة توضيحية لمقال: '+a.title):('Illustrative cover for: '+a.title); return `<div class="article-cover ${hero?'article-cover-hero':''}"><img src="${src}" alt="${alt}" loading="${hero?'eager':'lazy'}"><div class="cover-overlay"><span>${labels[a.cover][0]}</span><b>${labels[a.cover][1]}</b></div></div>`;}
function card(a){return `<article class="article-card">${cover(a)}<div class="article-body"><div class="article-meta">${a.category} · ${a.read}</div><h3>${a.title}</h3><p>${a.excerpt}</p><a class="article-read" href="${isAR?'articles-ar.html':'articles.html'}?id=${encodeURIComponent(a.id)}">${isAR?'اقرأ المقال ←':'Read article →'}</a></div></article>`;}
function toc(content){const re=/<h2>(.*?)<\/h2>/g; let m,items=[]; while((m=re.exec(content))) items.push(m[1].replace(/<[^>]+>/g,'')); if(!items.length)return ''; return `<aside class="article-toc"><strong>${isAR?'في هذا المقال':'In this article'}</strong><ol>${items.map(x=>`<li>${x}</li>`).join('')}</ol></aside>`;}
function render(){const root=document.getElementById('content'); if(id){const a=data.find(x=>x.id===id); if(!a){location.href=isAR?'articles-ar.html':'articles.html';return;} root.innerHTML=`<section class="section"><div class="wrap article-page"><a class="back-link" href="${isAR?'articles-ar.html':'articles.html'}">${isAR?'← العودة إلى مكتبة المقالات':'← Back to the article library'}</a>${cover(a,true)}<div class="article-kicker">${a.category} · ${a.read}</div><h1>${a.title}</h1><p class="article-intro">${a.excerpt}</p><div class="article-layout">${toc(a.content)}<div class="article-content">${a.content}</div></div><div class="article-end"><strong>${isAR?'من الفكرة إلى التطبيق':'From insight to application'}</strong><p>${isAR?'استخدم الأفكار الواردة هنا كإطار عمل، ثم اختبرها على واقعك وسياق مؤسستك قبل اتخاذ أي قرار.':'Use the framework as a starting point, then test it against your context and evidence before making a decision.'}</p></div></div></section>`;} else {root.innerHTML=`<section class="articles-hero"><div class="wrap"><div class="label">${isAR?'المقالات والرؤى':'INSIGHTS & ARTICLES'}</div><h1>${isAR?'معرفة مهنية تتحول إلى قرار وتنفيذ.':'Professional knowledge turned into decisions and action.'}</h1><p>${isAR?'مقالات موسعة في الموارد البشرية والتطوير المهني والاستقطاب والأداء والذكاء الاصطناعي ومستقبل العمل، تجمع بين الفهم والتشخيص وآليات التنفيذ وحل المشكلات والأمثلة العملية.':'Long-form articles on HR, career development, talent acquisition, performance, AI and the future of work — combining explanation, diagnosis, implementation, problem solving and practical examples.'}</p></div></section><section class="section"><div class="wrap"><div class="library-note">${isAR?'هذه مكتبة معرفية عملية. كل مقال يشرح الفكرة، ثم يحولها إلى إطار عمل وخطوات تنفيذ وأمثلة ونقاط يمكن استخدامها في الواقع.':'This is a practical knowledge library. Every article explains the idea, then turns it into a framework, implementation steps, examples and practical checks.'}</div><div class="article-library-grid">${data.map(card).join('')}</div></div></section>`;}}
render(); const mb=document.getElementById('menuBtn'),mn=document.getElementById('mobileNav');if(mb&&mn)mb.onclick=()=>mn.classList.toggle('open');
</script></body></html>
