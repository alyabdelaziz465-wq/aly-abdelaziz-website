<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المقالات والرؤى | علي عبد العزيز</title><meta name="description" content="مقالات مهنية متعمقة في الموارد البشرية والتطوير المهني والأداء والذكاء الاصطناعي ومستقبل العمل."><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="wrap head"><a class="brand" href="index-ar.html"><span>AA</span><small>علي عبد العزيز</small></a><nav class="nav"><a href="index-ar.html#hr">منظومة الموارد البشرية</a><a href="index-ar.html#people">الأفراد والأداء</a><a href="index-ar.html#career">التطوير المهني</a><a href="index-ar.html#ai">الذكاء الاصطناعي والعمل</a><a href="articles-ar.html">المقالات</a><a href="index-ar.html#contact">تواصل</a></nav><div class="head-actions"><button class="menu" id="menuBtn">☰ القائمة</button><a class="lang" href="articles.html">English</a></div></div><nav class="mobile" id="mobileNav"><a href="index-ar.html#hr">منظومة الموارد البشرية</a><a href="index-ar.html#people">الأفراد والأداء</a><a href="index-ar.html#career">التطوير المهني</a><a href="index-ar.html#ai">الذكاء الاصطناعي والعمل</a><a href="articles-ar.html">المقالات</a><a href="index-ar.html#contact">تواصل</a></nav></header><main id="content"></main><div class="wrap" style="padding:24px 0 0"><a class="btn ghost" href="article-editor.html">إضافة مقال جديد</a></div><script src="articles-data.js"></script><script>
const isAR=document.documentElement.lang==='ar';
const data=window.ARTICLE_LIBRARY[isAR?'ar':'en'];
const qs=new URLSearchParams(location.search); const id=qs.get('id');
const coverLabels={
 'cover-diagnosis':['DIAGNOSE','01'], 'cover-hiring':['EVIDENCE','02'], 'cover-performance':['PERFORMANCE','03'], 'cover-career':['CAREER','04'], 'cover-ai':['AI + HUMAN','05'], 'cover-skills':['SKILLS','06']
};
function cover(cls){const map={'cover-diagnosis':'A','cover-hiring':'B','cover-performance':'C','cover-career':'D','cover-ai':'E','cover-skills':'F'};const f=map[cls]||'A';return `<div class="article-cover ${cls}"><img src="covers/${f}.svg" alt="" loading="lazy"></div>`}
function card(a){return `<article class="article-card">${cover(a.cover)}<div class="article-body"><div class="article-meta">${a.category} · ${a.read}</div><h3>${a.title}</h3><p>${a.excerpt}</p><a class="article-read" href="${isAR?'articles-ar.html':'articles.html'}?id=${encodeURIComponent(a.id)}">${isAR?'اقرأ المقال ←':'Read article →'}</a></div></article>`}
function render(){const root=document.getElementById('content'); if(id){const a=data.find(x=>x.id===id); if(!a){location.href=isAR?'articles-ar.html':'articles.html';return;} root.innerHTML=`<section class="section"><div class="wrap article-page"><a class="back-link" href="${isAR?'articles-ar.html':'articles.html'}">${isAR?'← العودة إلى المقالات':'← Back to all articles'}</a>${cover(a.cover)}<div class="article-kicker">${a.category} · ${a.read}</div><h1>${a.title}</h1><p class="article-intro">${a.excerpt}</p><div class="article-content">${a.content}</div><div class="library-note">${isAR?'هذا المقال جزء من مكتبة معرفية تتوسع باستمرار. يمكن إضافة مقالات جديدة إلى ملف مكتبة المقالات ثم نشرها على الصفحة نفسها.':'This article is part of a growing knowledge library. New articles can be added to the article library file and published through this same page.'}</div></div></section>`;} else {root.innerHTML=`<section class="articles-hero"><div class="wrap"><div class="label">${isAR?'المقالات والرؤى':'INSIGHTS & ARTICLES'}</div><h1>${isAR?'معرفة مهنية تتحول إلى قرار وتنفيذ.':'Professional knowledge turned into decisions and action.'}</h1><p>${isAR?'مقالات تفصيلية في الموارد البشرية والتطوير المهني والاستقطاب والأداء والذكاء الاصطناعي ومستقبل العمل، مع التركيز على التشخيص وآليات التنفيذ وعلاج المشكلات.':'In-depth articles on HR, career development, talent acquisition, performance, AI and the future of work — with a strong focus on diagnosis, implementation and problem solving.'}</p></div></section><section class="section"><div class="wrap"><div class="library-note">${isAR?'هذه الصفحة هي مكتبة المقالات. كل مقال له صفحة قراءة مستقلة وصورة تعريفية، ويمكن توسيع المكتبة بإضافة مقالات جديدة إلى ملف articles-data.js.':'This is the article library. Every article has its own reading view and distinctive cover. The library can be expanded by adding new articles to articles-data.js.'}</div><div class="article-library-grid">${data.map(card).join('')}</div></div></section>`;}}
render();
const mb=document.getElementById('menuBtn'),mn=document.getElementById('mobileNav');if(mb&&mn)mb.onclick=()=>mn.classList.toggle('open');
</script></body></html>
