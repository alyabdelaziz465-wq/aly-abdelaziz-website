    .topbar {
      background: #071321;

    }

    .brand {

    }

    .brand span {
      color: #e8bd55;
    }

    .home-link {
      color: white;

    .hero {
      background: linear-gradient(135deg, #071321, #102438);

      text-align: center;
    }

    .eyebrow {
      color: #e8bd55;
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 14px;
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 62px);
      line-height: 1.25;
      margin: 20px auto;

    .hero h1 span {
      display: block;

      color: #e8bd55;
      margin-top: 15px;

    .subtitle {
      max-width: 820px;
      margin: auto;
      font-size: 21px;
      color: #d9e0e7;
    }

    .tags {
      margin-top: 30px;
    }

    .tag {
      display: inline-block;
      border: 1px solid #536579;
      border-radius: 30px;
      padding: 6px 15px;
      margin: 5px;
      color: #e8bd55;
      font-size: 14px;
    }

    .article {
      max-width: 980px;
      margin: -35px auto 70px;
      background: white;

    .profile {
      text-align: center;
      padding: 40px 25px 15px;
    }

    .profile img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 6px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.18);

    .profile h2 {
      margin: 15px 0 0;
    }

    .profile p {
      color: #697586;
      margin-top: 5px;
    }

    .content {
      padding: 25px 8% 55px;
    }

    .intro {
      background: #fff9e9;
      border-right: 5px solid #e8bd55;
      padding: 25px;
      border-radius: 12px;
      margin: 25px 0 40px;
      font-size: 19px;
    }

    h2 {
      color: #0b1c2d;
      font-size: 30px;
      margin-top: 45px;
    }

    h3 {
      color: #1b3854;
      font-size: 23px;
      margin-top: 30px;
    }

    p {
      font-size: 18px;
    }

    .en {
      direction: ltr;
      text-align: left;
      background: #f6f8fa;
      border-left: 4px solid #d7aa3f;
      padding: 18px 22px;
      margin: 15px 0 25px;
      border-radius: 10px;
    }

    .example {
      background: #f1f5f8;
      padding: 20px 25px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .example strong {
      color: #9a741d;
    }

    .step {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin: 25px 0;
      padding: 22px;
      border: 1px solid #e0e5ea;
      border-radius: 15px;
      background: #fff;
    }

    .number {
      min-width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #e8bd55;
      color: #071321;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .formula {
      background: #071321;
      color: white;
      padding: 28px;
      border-radius: 15px;
      text-align: center;
      font-size: 23px;
      margin: 35px 0;
    }

      color: #e8bd55;
    }

    .checklist {
      background: #f8fafb;
      padding: 25px 35px;
      border-radius: 15px;
    }

    .checklist li {
      margin: 12px 0;
      font-size: 18px;
    }

    .bottom-line {
      margin-top: 45px;
      background: linear-gradient(135deg, #071321, #18344d);
      color: white;
      padding: 35px;
      border-radius: 18px;
      text-align: center;
    }

    .bottom-line h2 {
      color: #e8bd55;
      margin-top: 0;
    }

      background: #071321;
      color: #bfc9d4;
      text-align: center;
      padding: 30px 20px;
    }

    footer a {
      color: #e8bd55;
      text-decoration: none;
    }

      .hero {
        padding: 45px 6%;
      }

      .content {
        padding: 20px 6% 40px;
      }

      .hero h1 {
        font-size: 36px;
      }

      .subtitle {
        font-size: 18px;
      }

      p,
      .checklist li {
        font-size: 17px;
      }

      .step {
        gap: 12px;
      }
